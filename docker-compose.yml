# docker compose up --build        → the server on http://localhost:8080 (the brief's station)
# SEMS_CONFIG=./config/station_bess.json docker compose up --build   → another station
# docker compose run --rm test     → unit tests + scenarios
services:
  sems:
    build: .
    ports:
      - "8080:8080"
    # The station is described by a JSON file, mounted where the server reads it.
    volumes:
      - ${SEMS_CONFIG:-./config/station.json}:/config/station.json:ro

  test:
    build:
      context: .
      target: tester
    profiles: ["test"] # not started by `docker compose up`
